# Render blueprint — API + agent worker (adjust names / branch / env in dashboard)
services:
  - type: web
    name: awaaz-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @awaaz/api exec prisma migrate deploy && pnpm --filter @awaaz/api exec prisma generate && pnpm --filter @awaaz/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

  - type: worker
    name: awaaz-agent-worker
    runtime: python
    plan: free
    rootDir: apps/agent-worker
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py start
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
