# Render blueprint — Phase 1.5 (adjust service name / branch / env in dashboard as needed)
services:
  - type: web
    name: awaaz-api
    runtime: node
    plan: free
    rootDir: .
    # Install pnpm on Render (global npm), apply migrations, generate client, build Nest.
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @awaaz/api exec prisma migrate deploy && pnpm --filter @awaaz/api exec prisma generate && pnpm --filter @awaaz/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
