# Render blueprint — Phase 1.5 (adjust service name / branch / env in dashboard as needed)
services:
  - type: web
    name: awaaz-api
    runtime: node
    plan: free
    rootDir: .
    # `--prod=false`: Render sets NODE_ENV=production; without this pnpm skips devDependencies
    # and `@nestjs/cli` is missing → `nest: not found`.
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @awaaz/api exec prisma migrate deploy && pnpm --filter @awaaz/api exec prisma generate && pnpm --filter @awaaz/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
